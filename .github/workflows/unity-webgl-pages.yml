name: Build WebGL and deploy to GitHub Pages

# Builds the Unity project as WebGL on every push to main and publishes the result to
# GitHub Pages.
#
# One-time setup before this can work:
#   1. Repository secrets UNITY_EMAIL / UNITY_PASSWORD (a Unity Personal account is enough),
#      or UNITY_LICENSE with an activation file - see https://game.ci/docs/github/activation
#   2. Settings -> Pages -> Source: GitHub Actions (not a branch)
#
# The build uses ProjectBootstrap.BuildWebGL rather than unity-builder's default entry point, so
# CI and a local "Tools > Colosseum > Build WebGL" produce byte-for-byte the same settings -
# including Compression Format = Disabled, without which Pages serves a white screen.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# A second push while a deploy is in flight should supersede it, not race it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-test-

      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: all
          githubToken: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build WebGL
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-WebGL-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildName: WebGL
          buildMethod: ColosseumDuel.EditorTools.ProjectBootstrap.BuildWebGLForCI

      # unity-builder writes to <buildsPath>/<targetPlatform>/<buildName>, i.e. build/WebGL/WebGL.
      # That inner folder is the site root - index.html must sit at the top of the artifact.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/WebGL

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
