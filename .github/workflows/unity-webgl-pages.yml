name: Build WebGL and publish to Pages

# Rebuilds the game in CI and publishes it to the gh-pages branch - the same branch
# Tools/publish-webgl.ps1 pushes to from a local build, so there is one publishing target and
# two ways to fill it.
#
# MANUAL-ONLY UNTIL UNITY CREDENTIALS EXIST. Unity cannot build headlessly without a licence,
# so with no secrets this workflow can only fail, and a red X on every push is worse than no
# automation. To turn it on:
#   1. Settings -> Secrets and variables -> Actions: add UNITY_EMAIL and UNITY_PASSWORD
#      (a free Unity Personal account is enough), or UNITY_LICENSE with an activation file -
#      see https://game.ci/docs/github/activation
#   2. Uncomment the `push` trigger below.
#
# Until then, publish with:  powershell -File Tools/publish-webgl.ps1

on:
  workflow_dispatch: {}
  # push:
  #   branches: [main]

permissions:
  contents: write   # the deploy step pushes the built site to gh-pages

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-test-

      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: all
          githubToken: ${{ secrets.GITHUB_TOKEN }}

  build-and-publish:
    name: Build WebGL and push to gh-pages
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-WebGL-

      # The same entry point as a local build, so CI and a developer's machine cannot drift
      # apart on the settings the published build depends on.
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildName: WebGL
          buildMethod: ColosseumDuel.EditorTools.ProjectBootstrap.BuildWebGLForCI

      # unity-builder writes to <buildsPath>/<targetPlatform>/<buildName>; that inner folder is
      # the site root, so index.html ends up at the top of gh-pages.
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/WebGL/WebGL
          publish_branch: gh-pages
          # Pages runs Jekyll on branch sources otherwise, which mangles the build.
          enable_jekyll: false
